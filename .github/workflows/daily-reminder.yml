name: Daily renewal reminder

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-expiry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger protected scheduler endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          SCHEDULED_TASK_SECRET: ${{ secrets.SCHEDULED_TASK_SECRET }}
        run: |
          test -n "$APP_URL"
          test -n "$SCHEDULED_TASK_SECRET"
          curl --fail-with-body --silent --show-error --request POST "$APP_URL/api/scheduled/check-expiry" \
            --header "X-Scheduled-Secret: $SCHEDULED_TASK_SECRET"
